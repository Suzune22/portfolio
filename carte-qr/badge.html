<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Badge QR — Delon Boyou</title>
<style>
  /* Badge vertical au format carte d'identité (CR80) : 54 × 85,6 mm, recto puis verso */
  @page { size: 54mm 85.6mm; margin: 0; }
  :root{ --paper:#ece7da; --ink:#141414; --night:#0b1748; --night-2:#1a3388; --blue:#5b8cff; --rust:#b35a1f; --ochre:#f2b45a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Inter', 'Liberation Sans', Arial, sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; background:#fff; }
  .mono{ font-family:'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
  .badge{ width:54mm; height:85.6mm; position:relative; overflow:hidden; border-radius:3mm; break-after:page; page-break-after:always; }
  .slot{ position:absolute; left:50%; top:3.2mm; width:13mm; height:2.6mm; transform:translateX(-50%); border-radius:1.3mm; }

  /* ---------- recto ---------- */
  .front{ background:var(--paper); color:var(--ink); }
  .front .slot{ background:#fff; box-shadow:inset 0 0 0 .25mm #b9b2a2; }
  .front .top{ position:absolute; left:4mm; right:4mm; top:7.6mm; display:flex; justify-content:space-between; font-size:5pt; letter-spacing:.12em; }
  .front .role{ position:absolute; left:4mm; top:10.8mm; font-size:17pt; font-weight:800; letter-spacing:-.02em; line-height:1; }
  .front .role em{ font-style:normal; color:var(--rust); }
  .front .ph{
    position:absolute; left:4mm; right:4mm; top:19mm; height:40mm; border-radius:1.6mm; overflow:hidden;
    background:radial-gradient(70% 60% at 70% 25%, #8fb2ff, transparent 70%), linear-gradient(160deg, #9fc0ff, #2f5fd0);
  }
  .front .ph .stars circle{ fill:#fff; }
  .front .ph img{ position:absolute; left:50%; top:2.5mm; transform:translateX(-50%); width:32mm; }
  .front .nm{ position:absolute; left:4mm; right:4mm; top:61mm; font-size:8.6pt; font-weight:800; letter-spacing:.02em; line-height:1.1; }
  .front .pos{ position:absolute; left:4mm; right:4mm; top:68.6mm; display:inline-flex; }
  .front .pos span{ font-size:5.6pt; font-weight:700; letter-spacing:.06em; color:#fff; background:var(--rust); padding:.9mm 1.8mm; border-radius:1mm; text-transform:uppercase; }
  .front .sub{ position:absolute; left:4mm; right:4mm; top:74.2mm; font-size:4.6pt; letter-spacing:.08em; color:#555; line-height:1.45; }
  .front .bar{ position:absolute; left:0; right:0; bottom:0; height:2.2mm; background:linear-gradient(90deg, var(--night), var(--blue)); }

  /* ---------- verso ---------- */
  .back{
    color:#fff; text-align:center;
    background:
      radial-gradient(70% 50% at 85% 10%, rgba(91,140,255,.55), transparent 70%),
      radial-gradient(60% 45% at 10% 95%, rgba(120,80,255,.4), transparent 70%),
      linear-gradient(170deg, #0d1c58 0%, var(--night-2) 55%, #0f2268 100%);
  }
  .back .slot{ background:#fff; }
  .back .stars{ position:absolute; inset:0; }
  .back .scan{ position:absolute; left:0; right:0; top:9.5mm; font-size:5.6pt; letter-spacing:.2em; color:var(--ochre); }
  .back h2{ position:absolute; left:3mm; right:3mm; top:13.2mm; font-size:11.5pt; font-weight:800; line-height:1.08; letter-spacing:-.015em; }
  .back h2 span{ color:#8fb2ff; }
  .back .qr{ position:absolute; left:50%; top:28mm; transform:translateX(-50%); width:36mm; height:36mm; padding:2.4mm; background:#fff; border-radius:2.2mm; }
  .back .qr img{ width:100%; height:100%; display:block; }
  .back .url{ position:absolute; left:0; right:0; top:66.5mm; font-size:5.2pt; }
  .back .url span{ background:rgba(255,255,255,.12); padding:.9mm 1.6mm; border-radius:1mm; }
  .back .contacts{ position:absolute; left:0; right:0; top:72.4mm; font-size:4.9pt; line-height:1.55; color:#c3cbef; }
</style>
</head>
<body>

<!-- RECTO -->
<section class="badge front">
  <div class="slot"></div>
  <div class="top mono"><span>UTT LOKO</span><span>2024 — 2027</span></div>
  <div class="role">GÉO<em>·</em>ENV</div>
  <div class="ph">
    <svg class="stars" viewBox="0 0 460 400" width="100%" height="100%" aria-hidden="true" style="position:absolute;inset:0">
      <circle cx="40" cy="40" r="2.2" opacity=".8"/><circle cx="110" cy="90" r="1.6" opacity=".6"/><circle cx="400" cy="60" r="2" opacity=".7"/>
      <circle cx="60" cy="200" r="1.6" opacity=".5"/><circle cx="420" cy="230" r="1.8" opacity=".6"/><circle cx="330" cy="30" r="1.4" opacity=".6"/>
      <line x1="390" y1="120" x2="330" y2="160" stroke="#fff" stroke-width="2" opacity=".6" stroke-linecap="round"/>
    </svg>
    <img src="../profil-pro.webp" alt="Delon Boyou" />
  </div>
  <div class="nm">BOYOU NESTOR<br />JEAN-JACQUES DELON</div>
  <div class="pos"><span>Vice-président · AE-GMPE</span></div>
  <div class="sub mono">ÉTUDIANT · GÉOLOGIE, MINES,<br />PÉTROLE &amp; ENVIRONNEMENT</div>
  <div class="bar"></div>
</section>

<!-- VERSO -->
<section class="badge back">
  <svg class="stars" viewBox="0 0 540 856" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#e6ecff">
      <circle cx="40" cy="80" r="1.8" opacity=".7"/><circle cx="500" cy="120" r="1.4" opacity=".6"/><circle cx="470" cy="40" r="1.2" opacity=".5"/>
      <circle cx="30" cy="560" r="1.4" opacity=".5"/><circle cx="510" cy="600" r="1.6" opacity=".6"/><circle cx="60" cy="820" r="1.2" opacity=".5"/>
      <circle cx="490" cy="830" r="1.6" opacity=".6"/>
    </g>
    <line x1="500" y1="200" x2="440" y2="240" stroke="#fff" stroke-width="1.6" opacity=".5" stroke-linecap="round"/>
  </svg>
  <div class="slot"></div>
  <div class="scan mono">SCANNEZ-MOI</div>
  <h2>Découvrez<br /><span>mon portfolio</span></h2>
  <div class="qr"><img src="qr-portfolio.svg" alt="QR code vers le portfolio de Delon Boyou" /></div>
  <div class="url mono"><span>suzune22.github.io/portfolio</span></div>
  <div class="contacts">boyoudelon47@gmail.com<br />+225 07 16 50 79 79</div>
</section>

</body>
</html>
